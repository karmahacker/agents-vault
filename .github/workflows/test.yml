name: Test Linux and macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keepassxc
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install --cask keepassxc
      - name: CLI tests
        run: |
          bash -n install.sh bin/sec bin/sec-mcp tests/smoke.sh tools/check-no-secrets.sh
          tests/smoke.sh
          python3 tests/regression.py
      - name: Install optional MCP without importing host credentials
        run: ./install.sh --with-mcp --no-system-link --no-timer --no-rules --no-import
      - name: Installed tools and MCP tests
        run: |
          "$HOME/.local/bin/sec" help
          "$HOME/.local/share/agents-vault/mcp-venv/bin/python" tests/mcp_integration.py
      - name: Generate and validate macOS scheduler configuration
        if: runner.os == 'macOS'
        run: |
          ./install.sh --no-system-link --no-rules --no-import
          plutil -lint "$HOME/Library/LaunchAgents/local.agents-vault.import.plist"
  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies and local tap
        run: |
          brew install --cask keepassxc
          git branch formula-ci HEAD
          AGENTS_VAULT_SOURCE_URL="file://$GITHUB_WORKSPACE" AGENTS_VAULT_SOURCE_BRANCH=formula-ci ./packaging/homebrew/prepare-tap.sh
      - name: Install package without configuring user files
        run: |
          test ! -e "$HOME/.agents-vault"
          test ! -e "$HOME/.config/agents-vault"
          test ! -e "$HOME/AGENTS.md"
          brew install --HEAD agents-vault/experimental/agents-vault
          test ! -e "$HOME/.agents-vault"
          test ! -e "$HOME/.config/agents-vault"
          test ! -e "$HOME/AGENTS.md"
          brew test agents-vault/experimental/agents-vault
      - name: Reinstall preserves user vault and configuration
        env:
          SEC_VAULT_DIR: ${{ runner.temp }}/brew-vault
          SEC_CONFIG_DIR: ${{ runner.temp }}/brew-config
        run: |
          sec init --no-timer --no-rules --no-import
          sec gen test/retained
          shasum -a 256 "$SEC_VAULT_DIR/agents.kdbx" "$SEC_VAULT_DIR/agents.keyx" "$SEC_CONFIG_DIR/sources.toml" > "$RUNNER_TEMP/vault-before.sha"
          brew reinstall agents-vault/experimental/agents-vault
          shasum -a 256 -c "$RUNNER_TEMP/vault-before.sha"
          sec doctor
          sec ls | grep -q test/retained
          brew uninstall agents-vault/experimental/agents-vault
          shasum -a 256 -c "$RUNNER_TEMP/vault-before.sha"
